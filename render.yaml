# Render Blueprint: FastAPI backend with a local SQLite database (no Postgres).
# Render dashboard > New > Blueprint > pick this repo. Fill the "sync: false" values when prompted.
#
# The free plan's disk is ephemeral: the SQLite file is wiped on every deploy, restart and idle spin-down.
# ORGTRACK_AUTO_SEED reloads the workbook + demo data whenever the database is empty, so the demo always
# comes back, but any changes made in the app are lost at the next restart.
services:
  - type: web
    name: orgtrack-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ORGTRACK_ENVIRONMENT
        value: production
      - key: ORGTRACK_AUTO_SEED
        value: "true"
      # Individual Tier demo months (Jul-Oct 2026, labelled illustrative, removable in KPI Scoring > Demo data).
      # Off by default in production, so the demo site must turn it on.
      - key: ORGTRACK_INDIVIDUAL_DEMO
        value: "true"
      - key: ORGTRACK_JWT_SECRET
        generateValue: true
      # Your Vercel URL(s), comma-separated, e.g. https://orgtrack.vercel.app
      - key: ORGTRACK_CORS_ORIGINS
        sync: false
      # Optional: allow Vercel preview deployments, e.g. https://orgtrack-.*\.vercel\.app
      - key: ORGTRACK_CORS_ORIGIN_REGEX
        sync: false
      # Shared demo code required on the sign-in page. Strongly recommended: the data names real employees.
      - key: ORGTRACK_DEMO_ACCESS_CODE
        sync: false
