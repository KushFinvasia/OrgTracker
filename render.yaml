# Render Blueprint: FastAPI backend + managed Postgres.
# Render dashboard > New > Blueprint > pick this repo. Fill the "sync: false" values when prompted.
services:
  - type: web
    name: orgtrack-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ORGTRACK_ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: orgtrack-db
          property: connectionString
      - key: ORGTRACK_JWT_SECRET
        generateValue: true
      # Your Vercel URL(s), comma-separated, e.g. https://orgtrack.vercel.app
      - key: ORGTRACK_CORS_ORIGINS
        sync: false
      # Optional: allow Vercel preview deployments, e.g. https://orgtrack-.*\.vercel\.app
      - key: ORGTRACK_CORS_ORIGIN_REGEX
        sync: false
      # Shared demo code required on the sign-in page. Strongly recommended: the data names real employees.
      - key: ORGTRACK_DEMO_ACCESS_CODE
        sync: false

databases:
  - name: orgtrack-db
    plan: free
    databaseName: orgtrack
    user: orgtrack
