<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Tier prototype</title>
<!-- Clickable prototype of the whole Project Tier, including the Project R&R plan (docs/project-tier-rr-plan.md).
     Uses the app's own stylesheet. All data is illustrative and lives in memory; "Reset prototype" restores it.
     Scripts: prototype/data.js, engine.js, ui.js, delivery.js, drawers.js, rr.js, admin.js, app.js. Add ?selftest to run the checks. -->
<link rel="stylesheet" href="mockup.css">
<style>
  body { width: auto; }
  .app { min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; }
  .nav svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; flex: none; }
  .persona { margin: 0 10px 10px; }
  .persona label { display: block; font-size: 11.5px; color: var(--side-muted); padding: 0 2px 4px; }
  .persona select { width: 100%; height: 34px; border-radius: var(--r-sm); background: var(--side-2); color: #fff; border: 1px solid var(--side-3); padding: 0 8px; }
  .proto-note { font-size: 12px; color: var(--muted); }
  .fn-chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; cursor: pointer; margin: 2px 4px 2px 0; }
  .fn-chip.on { background: var(--brand-tint); border-color: color-mix(in srgb, var(--brand) 40%, var(--line)); color: var(--brand-ink); font-weight: 500; }
  .fn-chip.on::before { content: "✓"; }
  .note { font-size: 12px; color: var(--muted); }
  .warn-txt { color: var(--warn); } .bad-txt { color: var(--bad); } .ok-txt { color: var(--ok); }
  .letters { display: inline-flex; gap: 3px; flex-wrap: wrap; }
  .letters span { font: 600 11px/18px var(--font-num); min-width: 18px; text-align: center; border-radius: 4px; background: var(--sunken); color: var(--muted); padding: 0 4px; }
  .letters span.A { background: var(--side); color: #f0d488; } .letters span.R { background: var(--brand-tint); color: var(--brand-ink); } .letters span.C { background: var(--info-tint); color: var(--info); }
  .letters span.x { text-decoration: line-through; opacity: .6; }
  .sug { border: 1px dashed color-mix(in srgb, var(--brand) 45%, var(--line)); background: var(--brand-tint); border-radius: var(--r-sm); padding: 10px 12px; font-size: 13px; }
  .mini-in { width: 64px; height: 30px; padding: 0 6px; border: 1px solid var(--line-strong); border-radius: var(--r-xs); text-align: right; font-variant-numeric: tabular-nums; background: var(--surface); }
  .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; } .toggle input { width: 16px; height: 16px; accent-color: var(--brand); }
  .checklist { list-style: none; margin: 0; padding: 0; }
  .checklist li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; } .checklist li:last-child { border-bottom: 0; }
  .checklist .st { width: 20px; height: 20px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 11px; font-weight: 700; margin-top: 1px; }
  .checklist .st.ok { background: var(--ok-tint); color: var(--ok); } .checklist .st.no { background: var(--bad-tint); color: var(--bad); }
  .checklist .act { margin-left: auto; flex: none; } .checklist .act select { width: 150px; }
  .stage-dots { display: inline-flex; gap: 3px; } .stage-dots i { width: 14px; height: 6px; border-radius: 2px; background: var(--sunken); display: inline-block; }
  .stage-dots i.done { background: var(--ok); } .stage-dots i.late { background: var(--warn); } .stage-dots i.now { background: var(--info); }
  .hidden-role { color: var(--faint); font-style: italic; font-size: 12.5px; }
  .tbl td.wrap { white-space: normal; }
  .select-sm { height: 30px; padding: 0 6px; border: 1px solid var(--line-strong); border-radius: var(--r-xs); background: var(--surface); font-size: 13px; }
  .kanban { display: grid; grid-template-columns: repeat(6, minmax(200px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
  .kcol { background: var(--sunken); border-radius: var(--r-md); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 180px; }
  .kcol-h { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 600; padding: 2px 4px 4px; }
  .kcard { display: flex; flex-direction: column; gap: 6px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px; font-size: 13px; width: 100%; }
  .kcard:hover { border-color: var(--line-strong); box-shadow: 0 1px 2px rgba(16,24,20,.08); }
  .kcard b { font-weight: 500; line-height: 1.35; }
  .kadd { justify-content: flex-start; color: var(--brand-ink); }
  /* timeline (gantt) */
  .gx-tools { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; margin-bottom: 12px; }
  .gx-legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
  .gx-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .gx-legend i { position: static; display: inline-block; width: 18px; height: 10px; margin: 0; border-radius: 3px; }
  .gx-legend .gx-over { border-left: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); }
  .gx-legend .gx-ghost-key { width: 0; height: 12px; border-left: 2px dashed var(--muted); border-radius: 0; }
  .gx-scroll { overflow-x: auto; border-radius: inherit; }
  .gx { min-width: 980px; }
  .gx-row { display: grid; grid-template-columns: 320px 1fr; border-bottom: 1px solid var(--line); }
  .gx-row:last-child { border-bottom: 0; }
  .gx-label { padding: 8px 14px; min-width: 0; border-right: 1px solid var(--line); display: flex; flex-direction: column; justify-content: center; gap: 3px; }
  .gx-name { background: none; border: 0; padding: 0; text-align: left; color: var(--ink); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; font-size: 13px; }
  a.gx-name:hover, button.gx-name:hover { color: var(--brand-ink); text-decoration: underline; text-underline-offset: 2px; }
  .gx-name .mono { margin-right: 8px; font-size: 11.5px; }
  .gx-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
  .gx-meta .avatar { width: 18px; height: 18px; font-size: 8px; }
  .gx-meta .badge { height: 18px; font-size: 11px; padding: 0 6px; }
  .gx-track { position: relative; min-height: 50px; background-image: linear-gradient(to right, var(--line) 1px, transparent 1px); background-size: var(--wk) 100%; }
  .gx-head { position: relative; z-index: 3; background: var(--surface-2); }
  .gx-head .gx-label { font-size: 12px; color: var(--muted); font-weight: 500; }
  .gx-head .gx-track { min-height: 40px; }
  .gx-wk { position: absolute; top: 12px; padding-left: 6px; font-size: 11.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .gx-wk b { color: var(--ink-2); font-weight: 600; }
  .gx-now { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--bad); opacity: .45; z-index: 0; }
  .gx-today-tag { position: absolute; top: 10px; transform: translateX(-50%); background: var(--bad); color: #fff; font: 600 11px/20px var(--font); padding: 0 8px; border-radius: 10px; z-index: 2; white-space: nowrap; }
  .gx-bar { position: absolute; top: 50%; height: 20px; margin-top: -10px; border-radius: 5px; overflow: hidden; border: 1px solid transparent; cursor: pointer; z-index: 1; }
  .gx-bar:hover { box-shadow: 0 0 0 2px color-mix(in srgb, var(--ink) 18%, transparent); }
  .gx-fill { position: absolute; top: 0; bottom: 0; left: 0; display: block; }
  .s-done { background: var(--ok); }
  .s-progress { background: var(--info-tint); border-color: color-mix(in srgb, var(--info) 45%, transparent); } .s-progress .gx-fill { background: var(--info); }
  .s-review { background: var(--warn-tint); border-color: color-mix(in srgb, var(--warn) 50%, transparent); } .s-review .gx-fill { background: color-mix(in srgb, var(--warn) 55%, transparent); }
  .s-blocked { background: var(--bad-tint); border-color: color-mix(in srgb, var(--bad) 50%, transparent); } .s-blocked .gx-fill { background: color-mix(in srgb, var(--bad) 65%, transparent); }
  .s-todo { background: var(--surface); border: 1px dashed var(--line-strong); }
  .gx-over { position: absolute; top: 50%; height: 20px; margin-top: -10px; border-radius: 0 5px 5px 0; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--bad) 32%, transparent) 0 4px, transparent 4px 8px); border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); border-left: 0; }
  .gx-text { position: absolute; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--ink-2); white-space: nowrap; z-index: 1; pointer-events: none; font-variant-numeric: tabular-nums; }
  .gx-ghost { position: absolute; top: 12px; bottom: 12px; border-left: 2px dashed var(--muted); z-index: 1; }
  .gx-off { padding: 12px 14px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); }
  .grid-3 .panel.clickable:hover { border-color: var(--line-strong); }
  details summary { cursor: pointer; color: var(--muted); margin-top: 8px; }
  /* task drawer: one view */
  .tfacts { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink-2); padding: 0 0 16px; border-bottom: 1px solid var(--line); }
  .tfacts b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .tdesc { flex-basis: 100%; color: var(--muted); }
  .tsec { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .tsec:last-child { border-bottom: 0; }
  .tsec h3 { font-size: 13.5px; margin-bottom: 10px; }
  .tsec-open { background: var(--surface-2); margin: 0 -22px; padding: 16px 22px; }
  .tgrid { grid-template-columns: 170px 110px minmax(0, 1fr) auto; gap: 12px 14px; align-items: start; }
  .tgrid.locked { grid-template-columns: 110px minmax(0, 1fr) auto; }
  .tgrid.locked.nostat { grid-template-columns: minmax(0, 1fr) auto; }
  .tgrid .full { grid-column: 1 / -1; }
  .tsub .tgrid { grid-template-columns: 1fr 1fr; }
  .tsave { padding-top: 26px; }
  .tlock { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); margin: -2px 0 10px; }
  .tlock .ico { width: 13px; height: 13px; }
  .tsec-actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .tsec-actions.start { justify-content: flex-start; margin-top: 0; }
  .tsec-actions.start .note { margin-left: 4px; }
  .tsub { display: flex; flex-direction: column; gap: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 16px; margin-top: 10px; }
  .tsub .check { margin: 2px 0; }
  .tdep { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; padding: 6px 0; }
  .tdep .badge { height: 20px; font-size: 11.5px; }
  .tlinks { display: flex; gap: 10px; align-items: center; font-size: 13px; padding-top: 4px; }
  .link-btn.on { text-decoration: underline; text-underline-offset: 3px; }
  @media (max-width: 700px) { .tgrid, .tgrid.locked, .tgrid.locked.nostat, .tsub .tgrid { grid-template-columns: 1fr; } .tsave { padding-top: 0; } }
  .menu-toggle { display: none; }
  .grid > *, .split > *, .stack > * { min-width: 0; }
  @media (max-width: 900px) { .menu-toggle { display: inline-grid; } .proto-note, .search-btn .kbd { display: none; } .search-btn { min-width: 0; } .topbar { padding: 0 12px; } .crumbs { display: none; }
    .side { position: fixed; z-index: 70; left: 0; top: 0; bottom: 0; width: 264px; transform: translateX(-100%); transition: transform var(--d3) var(--ease); } body.nav-open .side { transform: none; box-shadow: var(--shadow-drawer); }
    .app { grid-template-columns: 1fr; } .split, .grid-3, .grid-2, .grid-main, .drawer-split, .form-grid { grid-template-columns: 1fr; } .content { padding: 16px; } .figures { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="brand" href="#/home"><span class="logo logo-dark"><img src="../../frontend/public/finvasia-logo-light.svg" alt="Finvasia"><span class="logo-sub">Elevate</span></span></a>
    <button class="tier-btn" data-act="toast:The Individual Tier is a separate prototype area and isn't part of this file"><span><span class="t1">Finvasia</span><span class="t2">Project Tier</span></span></button>
    <nav class="nav" id="nav" aria-label="Project Tier"></nav>
    <div class="persona"><label for="persona">Prototype: view as</label><select id="persona"></select></div>
    <div class="side-foot"><button class="me-btn" id="me"></button></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="menu" aria-label="Open navigation"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="crumbs" id="crumbs"></div>
      <div class="top-actions">
        <span class="proto-note">Illustrative prototype · data is not real</span>
        <button class="search-btn" data-act="openPalette"><svg class="ico" viewBox="0 0 24 24"><path d="M11 4a7 7 0 1 1 0 14a7 7 0 0 1 0-14z"/><path d="m20 20-4-4"/></svg>Search<span class="kbd">Ctrl K</span></button>
        <button class="icon-btn" data-act="openBell" aria-label="Notifications"><span class="bell"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg><span class="count-badge" id="bell-count">3</span></span></button>
        <button class="btn sm" id="reset">Reset prototype</button>
      </div>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>
<div id="layer"></div>
<script src="prototype/data.js"></script>
<script src="prototype/engine.js"></script>
<script src="prototype/ui.js"></script>
<script src="prototype/delivery.js"></script>
<script src="prototype/drawers.js"></script>
<script src="prototype/rr.js"></script>
<script src="prototype/admin.js"></script>
<script src="prototype/app.js"></script>
<script src="prototype/selftest.js"></script>
</body>
</html>
